<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1">

<title>V-TWIN | Coming Soon</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link
href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Inter:wght@300;400;700;900&display=swap"
rel="stylesheet">

<style>

:root{

--bg:#080808;
--surface:#121212;

--text:#fff;

--muted:#A8A8A8;

--cr:#C0392B;

--border:
rgba(255,255,255,.08);

}

/* THEMES */

[data-theme="gold"]{
--cr:#D4A62A;
}

[data-theme="blue"]{
--cr:#2D78FF;
}

[data-theme="green"]{
--cr:#18A26B;
}

*{

margin:0;

padding:0;

box-sizing:border-box;

}

html{

scroll-behavior:smooth;

}

body{

font-family:Inter;

background:var(--bg);

color:var(--text);

transition:.35s;

overflow:hidden;

}

/* NAV */

nav{

position:fixed;

top:0;

left:0;

width:100%;

padding:20px 8%;

display:flex;

justify-content:
space-between;

align-items:center;

z-index:999;

backdrop-filter:
blur(14px);

background:
rgba(0,0,0,.28);

border-bottom:
1px solid
var(--border);

}

.logo{

font-family:
"Black Ops One";

font-size:
2rem;

}

.logo span{

color:
var(--cr);

}

.nav-right{

display:flex;

gap:12px;

}

.nav-btn{

background:
var(--surface);

border:
1px solid
var(--border);

color:
white;

padding:
12px 16px;

cursor:pointer;

border-radius:
14px;

transition:.3s;

}

.nav-btn:hover{

border-color:
var(--cr);

}

/* HERO */

.hero{

height:100vh;

height:100svh;

position:relative;

display:grid;

place-items:center;

overflow:hidden;

}

.hero::before{

content:"";

position:absolute;

inset:0;

background:

radial-gradient(

circle,

rgba(192,57,43,.18),

transparent 55%

);

}

.grid{

position:absolute;

inset:0;

opacity:.05;

background-image:

linear-gradient(
white 1px,
transparent 1px
),

linear-gradient(
90deg,
white 1px,
transparent 1px
);

background-size:

70px 70px;

}

.content{

position:relative;

z-index:2;

text-align:center;

padding:20px;

}

.top{

letter-spacing:10px;

color:
var(--cr);

margin-bottom:30px;

font-size:
.8rem;

}

.title{

font-family:
"Black Ops One";

font-size:
clamp(
4rem,
14vw,
10rem
);

line-height:.88;

text-shadow:

0 0 40px
rgba(
192,
57,
43,
.35
);

animation:
fadeUp
1s;

}

.sub{

margin-top:30px;

color:
var(--muted);

letter-spacing:4px;

}

@keyframes fadeUp{

from{

opacity:0;

transform:
translateY(
30px
);

}

}

/* MOBILE */

@media(
max-width:768px
){

.title{

font-size:
4rem;

}

.top{

letter-spacing:
5px;

}

.sub{

font-size:
.9rem;

}

}

</style>

</head>

<body>

<!-- NAV -->

<nav>

<div class="logo">

V-TWIN
<span>

SOON

</span>

</div>


<div class="nav-right">

<button
class="nav-btn"
id="langBtn">

AR

</button>

<button
class="nav-btn"
id="themeBtn">

🎨

</button>

</div>

</nav>


<!-- HERO -->

<section
class="hero">

<div
class="grid">

</div>


<div
class="content">

<div

class="top"

data-en="V-TWIN BROTHERHOOD"

data-ar="أخوّة V-TWIN">

V-TWIN BROTHERHOOD

</div>


<div

class="title"

data-en="COMING<br>SOON"

data-ar="قريباً<br>جداً">

COMING
<br>
SOON

</div>


<div

class="sub"

data-en="Something special is being prepared."

data-ar="يتم تحضير شيء مميز.">

Something special is being prepared.

</div>

</div>

</section>


<script>

/* LANG */

let ar=false;

langBtn.onclick=()=>{

ar=!ar;

document.documentElement.lang=

ar

?

"ar"

:

"en";

document.documentElement.dir=

ar

?

"rtl"

:

"ltr";

document
.querySelectorAll(

"[data-en]"

)

.forEach(

e=>{

e.innerHTML=

e.dataset[

ar

?

"ar"

:

"en"

];

}

);

};


/* THEMES */

const themes=

[

"",

"gold",

"blue",

"green"

];

let current=0;

themeBtn.onclick=()=>{

current++;

if(

current>=themes.length

)

current=0;

document.body.setAttribute(

"data-theme",

themes[current]

);

};

</script>

</body>

</html>
